name: build-site

# 内容变化（content/ 或构建脚本）时自动重建 docs/ 并提交，
# 让"纯浏览器添加内容"也能发布站点。
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 冒烟测试
        run: python test_md2html.py

      - name: 重建站点
        run: python build.py

      - name: 提交更新的 docs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "docs 无变化，跳过提交"
          else
            git commit -m "chore: Actions 自动重建站点 docs"
            git push
          fi
